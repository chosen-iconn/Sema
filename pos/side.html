<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaccoCore - Premium SaaS Layout</title>
  
  <!-- Font Setup -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration and Custom Styles -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B1F4B',
              navyDark: '#06112a',
              red: '#E5283C',
              redLight: '#FF5A6B',
              muted: '#5B6785',
              softText: '#9FB0DB',
              bgLight: '#F4F7FB',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-brand-bgLight text-slate-900 antialiased selection:bg-brand-red selection:text-white">

  <!-- App Layout Wrapper -->
  <div class="flex h-screen w-full overflow-hidden">
    
    <!-- Premium SaaS Sidebar -->
    <aside class="relative flex h-full w-[280px] shrink-0 flex-col justify-between overflow-hidden border-r border-white/5 bg-gradient-to-b from-brand-navy to-brand-navyDark text-white shadow-[10px_0_40px_rgba(11,31,75,0.15)] z-20">
      
      <!-- Subtle ambient glow background -->
      <div class="pointer-events-none absolute -left-20 -top-20 h-64 w-64 rounded-full bg-brand-red/10 blur-[80px]"></div>

      <!-- Header / Logo Area -->
      <div class="relative flex h-20 shrink-0 items-center gap-3 px-6 pt-2">
        <div class="flex h-9 w-9 items-center justify-center rounded-[10px] bg-gradient-to-br from-brand-red to-[#ff6a5e] text-lg font-bold text-white shadow-[0_8px_16px_rgba(229,40,60,0.25)] ring-1 ring-white/20 transition-transform duration-300 hover:scale-105 cursor-pointer">
          S
        </div>
        <span class="text-xl font-extrabold tracking-tight">Sacco<span class="text-brand-redLight">Core</span></span>
      </div>

      <!-- Scrollable Navigation -->
      <div class="relative z-10 flex-1 overflow-y-auto px-4 py-2 scrollbar-hide">
        
        <!-- Main Menu Section -->
        <div class="mb-8">
          <div class="mb-3 flex items-center gap-2 px-2">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-brand-muted">Overview</span>
            <div class="h-px flex-1 bg-white/5"></div>
          </div>
          <nav class="flex flex-col gap-1.5">
            
            <!-- Active Nav Item -->
            <a href="#" class="group relative flex items-center justify-between rounded-xl bg-brand-red px-3 py-2.5 text-sm font-semibold text-white shadow-[0_4px_20px_rgba(229,40,60,0.3)] transition-all">
              <div class="flex items-center gap-3 transition-transform duration-300">
                <svg class="h-5 w-5 opacity-100 drop-shadow-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                Dashboard
              </div>
            </a>

            <!-- Inactive Nav Item -->
            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <!-- Animated left border on hover -->
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Members
              </div>
            </a>

            <!-- Inactive Nav Item with Badge -->
            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
                Loans
              </div>
              <span class="flex h-[22px] items-center justify-center rounded-full bg-brand-red/90 px-2.5 text-[10px] font-bold text-white shadow-sm ring-1 ring-brand-red animate-pulse-slow">3 Pending</span>
            </a>

            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                Treasury
              </div>
            </a>
          </nav>
        </div>

        <!-- Secondary Menu Section -->
        <div>
          <div class="mb-3 flex items-center gap-2 px-2">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-brand-muted">Administration</span>
            <div class="h-px flex-1 bg-white/5"></div>
          </div>
          <nav class="flex flex-col gap-1.5">
            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                Reconciliation
              </div>
              <span class="flex h-[20px] items-center justify-center rounded-md bg-white/10 px-2 text-[10px] font-bold text-brand-softText group-hover:bg-white/20 group-hover:text-white transition-colors">Action needed</span>
            </a>

            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                Audit Trail
              </div>
            </a>

            <a href="#" class="group relative flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all duration-300 hover:bg-white/5 hover:text-white">
              <div class="absolute inset-y-2.5 left-0 w-1 rounded-r-md bg-brand-red opacity-0 transition-all duration-300 group-hover:opacity-100"></div>
              <div class="flex items-center gap-3 transition-transform duration-300 group-hover:translate-x-1">
                <svg class="h-5 w-5 opacity-60 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                Settings
              </div>
            </a>
          </nav>
        </div>
      </div>

      <!-- User Profile Footer -->
      <div class="relative z-10 p-4 pt-2">
        <div class="group flex items-center justify-between rounded-[14px] bg-white/5 p-2 outline outline-1 outline-white/5 transition-all duration-300 hover:bg-white/10 hover:outline-white/20 hover:shadow-[0_4px_12px_rgba(0,0,0,0.2)] cursor-pointer">
          <div class="flex items-center gap-3 overflow-hidden pl-1">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-brand-navyDark text-[13px] font-bold text-brand-softText shadow-inner ring-1 ring-white/5 transition-colors group-hover:text-white">
              GW
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-[13px] font-bold text-white transition-colors">Grace Wanjiru</p>
              <p class="truncate text-[11px] font-medium text-brand-softText transition-colors group-hover:text-white/70">Chairman</p>
            </div>
          </div>
          <button class="shrink-0 rounded-lg p-2 text-brand-muted transition-colors hover:bg-brand-red hover:text-white">
            <svg class="h-[18px] w-[18px]" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area Context -->
    <main class="flex min-w-0 flex-1 flex-col overflow-y-auto">
      
      <!-- Premium App Header -->
      <header class="sticky top-0 z-10 flex h-20 items-center justify-between border-b border-slate-200 bg-white/80 px-8 backdrop-blur-md">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Dashboard</h1>
          <p class="text-sm text-slate-500 font-medium">Here's what's happening with your SACCO today.</p>
        </div>
        
        <div class="flex items-center gap-4">
          <!-- Search -->
          <div class="relative hidden sm:block">
            <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="Search members..." class="h-10 w-64 rounded-full border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm outline-none transition-all focus:border-brand-navy focus:bg-white focus:ring-2 focus:ring-brand-navy/10">
          </div>
          
          <!-- Notifications -->
          <button class="relative rounded-full border border-slate-200 bg-white p-2.5 text-slate-600 transition-colors hover:bg-slate-50 hover:text-brand-navy">
            <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-brand-red ring-2 ring-white"></span>
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </button>
        </div>
      </header>

      <!-- Content Canvas -->
      <div class="flex-1 p-8">
        <div class="flex h-full w-full flex-col items-center justify-center rounded-[2rem] border-2 border-dashed border-slate-200 bg-white/50">
          <div class="animate-float mb-4 rounded-full bg-brand-bgLight p-6">
            <svg class="h-10 w-10 text-slate-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          </div>
          <p class="text-sm font-semibold text-slate-500">Main Content Canvas</p>
          <p class="text-xs text-slate-400 mt-1">Your dashboard widgets go here.</p>
        </div>
      </div>
    </main>

  </div>
</body>
</html>
