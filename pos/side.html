<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaccoCore - Premium Sidebar</title>
  
  <!-- Font Setup -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration and Custom Styles -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B1F4B',
              navyDark: '#081230',
              red: '#E5283C',
              redLight: '#FF5A6B',
              muted: '#5B6785',
              softText: '#9FB0DB',
              bgLight: '#F3F6FC',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-brand-bgLight text-slate-900 antialiased selection:bg-brand-red selection:text-white">

  <!-- App Layout Wrapper -->
  <div class="flex h-screen w-full overflow-hidden">
    
    <!-- Premium SaaS Sidebar -->
    <aside class="flex h-full w-72 shrink-0 flex-col justify-between border-r border-white/10 bg-brand-navy text-white shadow-2xl">
      
      <!-- Header / Logo Area -->
      <div class="flex h-20 shrink-0 items-center gap-3 px-6">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-red to-[#ff6a5e] text-lg font-bold text-white shadow-lg shadow-brand-red/20">
          S
        </div>
        <span class="text-xl font-extrabold tracking-tight">Sacco<span class="text-brand-redLight">Core</span></span>
      </div>

      <!-- Scrollable Navigation -->
      <div class="flex-1 overflow-y-auto px-4 py-4 scrollbar-hide">
        
        <!-- Main Menu Section -->
        <div class="mb-8">
          <p class="mb-3 px-2 text-[11px] font-bold uppercase tracking-wider text-brand-muted">Overview</p>
          <nav class="flex flex-col gap-1.5">
            <!-- Active Nav Item -->
            <a href="#" class="group flex items-center justify-between rounded-xl bg-brand-red px-3 py-2.5 text-sm font-semibold text-white shadow-md shadow-brand-red/20 transition-all">

                <svg class="h-5 w-5 opacity-90" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                Dashboard
              </div>

            <!-- Inactive Nav Item -->
            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

              </div>
            </a>

            <!-- Inactive Nav Item with Badge -->
            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>

              <span class="flex h-[22px] items-center justify-center rounded-full bg-brand-red px-2.5 text-[10px] font-bold text-white shadow-sm">3 Pending</span>
            </a>

            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                Treasury
              </div>
            </a>
          </nav>
        </div>

        <!-- Secondary Menu Section -->
        <div>
          <p class="mb-3 px-2 text-[11px] font-bold uppercase tracking-wider text-brand-muted">Administration</p>
          <nav class="flex flex-col gap-1.5">
            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                Reconciliation
              </div>
              <span class="flex h-[22px] items-center justify-center rounded-full bg-white/10 px-2.5 text-[10px] font-bold text-white">Action needed</span>
            </a>

            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                Audit Trail
              </div>
            </a>

            <a href="#" class="group flex items-center justify-between rounded-xl px-3 py-2.5 text-sm font-medium text-brand-softText transition-all hover:bg-white/10 hover:text-white">
              <div class="flex items-center gap-3">
                <svg class="h-5 w-5 opacity-70 transition-opacity group-hover:opacity-100" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                Settings
              </div>
            </a>
          </nav>
        </div>
      </div>

      <!-- User Profile Footer -->
      <div class="p-4">
        <div class="group flex items-center justify-between rounded-2xl bg-white/5 p-3 outline outline-1 outline-white/10 transition-all hover:bg-white/10 hover:outline-white/20 cursor-pointer shadow-lg shadow-black/10">
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-brand-navyDark text-sm font-bold text-brand-softText shadow-inner">
              GW
            </div>
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-white transition-colors">Grace Wanjiru</p>
              <p class="truncate text-[11px] font-medium text-brand-softText">Chairman</p>
            </div>
          </div>
          <button class="shrink-0 rounded-lg p-2 text-brand-muted transition-colors hover:bg-white/10 hover:text-white">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area Placeholder -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8">
      <div class="flex h-full w-full flex-col items-center justify-center rounded-3xl border-2 border-dashed border-slate-200 bg-white">
        <p class="text-sm font-medium text-slate-400">Main Content Area</p>
      </div>
    </main>

  </div>
</body>
</html>
